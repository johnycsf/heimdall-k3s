# Heimdall on Kubernetes — official php:apache image + upstream Heimdall source
# Image: ghcr.io/johnycsf/heimdall (built from Dockerfile in this repo)
apiVersion: v1
kind: Namespace
metadata:
  name: heimdall
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heimdall-config
  namespace: heimdall
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall
  namespace: heimdall
  labels:
    app: heimdall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: heimdall
  template:
    metadata:
      labels:
        app: heimdall
    spec:
      containers:
        - name: heimdall
          image: ghcr.io/johnycsf/heimdall:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "America/New_York"
            - name: ALLOW_INTERNAL_REQUESTS
              value: "true"
            - name: APP_URL
              value: "http://localhost"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: heimdall-config
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall
  namespace: heimdall
spec:
  type: LoadBalancer
  selector:
    app: heimdall
  ports:
    - name: http
      port: 80
      targetPort: http
